name: toolkit-guard

# Guards for the Command Room 2 dev skills: operator fences, quick_validate and the
# description budget, on every push and pull request. (The cross-repo overlap guard was
# retired on 2026-10-04 when the Command Room 1 toolkit moved to the chalette plugin.)

on:
  push:
  pull_request:

jobs:
  guard2-fences-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Guard 2 — operator fences + quick_validate (all skills)
        run: pytest tests/ -v

