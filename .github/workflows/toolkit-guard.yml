name: toolkit-guard

# Checks for the Command Room 1 dev skills (cr1-report, cr1-scrub, cr1-test, cr1-desk) on
# every push and pull request: the committed operator profile stays the contractor default
# with exactly the keys the skills read, the overlay is never tracked, every skill passes
# quick_validate, descriptions (skills and manifests) stay under budget, the skills target
# cr1, the scrub script works on sample books, and the test-log prompt is present.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Operator fences, quick_validate, description budget, cr1 target, scrub
        run: pytest tests/ -v

